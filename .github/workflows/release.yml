# Release pipeline for a local-first Flutter app (Profile A).
#
# Trigger: push a tag like v1.2.0
#   git tag v1.2.0 && git push origin v1.2.0
#
# Produces:
#   - GitHub Release with Linux, Windows and macOS archives and update.json
#     (the signed Android APK is attached manually afterwards, see Caveats)
#   - Web build zip (nisabitus-vX.Y.Z-web.zip, base href /) on the Release.
#     GitHub Pages is NOT deployed here: deploy-pages.yml publishes every push
#     to main at https://iezappa.github.io/nisabitus/
#   - Multi-arch Docker image ghcr.io/iezappa/nisabitus:<version> and :latest
#
# One-time repo setup:
#   - Commit apps/client/web/sqlite3.wasm and apps/client/web/drift_worker.js
#   - Commit apps/client/web/sw.js, apps/client/web/flutter_bootstrap.js and
#     apps/client/tool/generate_sw.sh (own service worker, STACK-APPS-DINAMICAS.md 8.2)
#   - Commit apps/client/web/update.json ({"version","schemaChange","minSupportedVersion"});
#     it is also attached to the GitHub Release (STACK-APPS-DINAMICAS.md 8.2)
#   - pubspec.yaml version x.y.z+build must match the tag vx.y.z
#   - Commit PRIVACY.md, TERMS.md and their .es.md translations at the repo root (templates/legal, CUMPLIMIENTO.md)
#
# Caveats:
#   - The Android APK is NOT built here. The maintainer builds and signs it
#     locally with the app's release keystore and uploads it to this release
#     with apps/client/tool/release_apk.sh (FIRMA-ANDROID.md,
#     STACK-APPS-DINAMICAS.md 8.1). Never store the keystore or its passwords
#     in repository secrets.
#   - macOS/Windows builds are unsigned: Gatekeeper/SmartScreen will warn.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR

env:
  APP_DIR: apps/client
  # The tag and the repository name, reached through the environment instead
  # of being interpolated into every `run:` script. `${{ github.ref_name }}`
  # is pasted into the shell as text before it runs, so a ref whose name
  # contained shell metacharacters would become code; as a variable it is
  # only ever data. Tags here are pushed by the maintainer, so this is
  # defence in depth rather than a live hole — but the archive names are
  # built in four different shells, and only one of them has to be wrong.
  TAG: ${{ github.ref_name }}
  REPO_NAME: ${{ github.event.repository.name }}
  # Pinned like ci.yml and deploy-pages.yml.
  FLUTTER_VERSION: 3.47.1

defaults:
  run:
    working-directory: apps/client

jobs:
  # Fails fast if pubspec.yaml version or update.json do not match the tag,
  # or if the compliance gate fails.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # TAG comes from the workflow env above, not from a step-level copy.
      - name: Check pubspec version matches tag
        run: |
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          if [ "v${PUBSPEC_VERSION}" != "${TAG}" ]; then
            echo "::error::pubspec.yaml version '${PUBSPEC_VERSION}' does not match tag '${TAG}'"
            exit 1
          fi
          if [ -f web/update.json ] && ! grep -q "\"version\"[[:space:]]*:[[:space:]]*\"${PUBSPEC_VERSION}\"" web/update.json; then
            echo "::error::web/update.json version does not match tag '${TAG}'"
            exit 1
          fi
      # Compliance gate (CUMPLIMIENTO.md): legal docs present and filled in,
      # no analytics/ads/tracking packages unless explicitly allowlisted after
      # implementing a consent flow. Space-separated package names.
      - name: Check legal docs and tracking dependencies
        env:
          TRACKING_ALLOWLIST: ""
        run: |
          fail=0
          for doc in ../../PRIVACY.md ../../PRIVACY.es.md ../../TERMS.md ../../TERMS.es.md; do
            if [ ! -f "$doc" ]; then
              echo "::error::Missing ${doc#../../} (templates/legal, CUMPLIMIENTO.md)"; fail=1
            elif grep -q '{{' "$doc"; then
              echo "::error::${doc#../../} still contains {{...}} placeholders"; fail=1
            fi
          done
          for pkg in firebase_analytics google_mobile_ads facebook_app_events \
                     appsflyer_sdk adjust_sdk amplitude_flutter mixpanel_flutter \
                     posthog_flutter segment_analytics flutter_branch_sdk \
                     sentry_flutter; do
            if grep -Eq "^[[:space:]]+${pkg}:" pubspec.yaml; then
              case " ${TRACKING_ALLOWLIST} " in
                *" ${pkg} "*) echo "Allowlisted tracking package: ${pkg}" ;;
                *) echo "::error::${pkg} in pubspec.yaml is not in TRACKING_ALLOWLIST (CUMPLIMIENTO.md items 5 and 8)"; fail=1 ;;
              esac
            fi
          done
          exit "$fail"

  # The same gate ci.yml puts in front of every branch. A tag is the commit
  # that reaches users, and it can be pushed from a branch CI never saw, or
  # while CI was still red — so the checks run again here rather than being
  # assumed. Everything below waits for this.
  check:
    name: Format, analyse, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyse
        run: dart analyze lib test
      - name: Test
        run: flutter test

  linux:
    needs: [version-check, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf "../../${REPO_NAME}-${TAG}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: "*-linux-x64.tar.gz"

  windows:
    needs: [version-check, check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "../../${env:REPO_NAME}-${env:TAG}-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: "*-windows-x64.zip"

  macos:
    needs: [version-check, check]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/${REPO_NAME}-${TAG}-macos.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: "*-macos.zip"

  web:
    needs: [version-check, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Served from the root of its own origin, like the Docker image.
      - run: flutter build web --release --base-href / --no-web-resources-cdn
      # Own service worker: inject version + precache manifest (last step
      # that touches build/web).
      - run: sh tool/generate_sw.sh build/web pubspec.yaml
      - run: cd build/web && zip -qr "$GITHUB_WORKSPACE/${REPO_NAME}-${TAG}-web.zip" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web
          path: "*-web.zip"

  docker:
    # Packages the bundle the `web` job built, so the image ships the exact
    # toolchain the tests ran on without needing a Flutter image per version.
    needs: [version-check, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web
      - run: mkdir web && unzip -q *-web.zip -d web
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [linux, windows, macos, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: apps/client/web/update.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: if [ -f apps/client/web/update.json ]; then cp apps/client/web/update.json dist/; fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Android:** the maintainer builds, signs and attaches the APK (`${{ env.REPO_NAME }}-${{ env.TAG }}-android.apk`) and its `.sha256` by hand with `apps/client/tool/release_apk.sh` shortly after this release is created. If they are not under Assets yet, check back later.

            **Android:** el mantenedor adjunta a mano el APK firmado (`${{ env.REPO_NAME }}-${{ env.TAG }}-android.apk`) y su `.sha256` con `apps/client/tool/release_apk.sh` poco después de crear esta release. Si todavía no aparecen en Assets, vuelve a mirar más tarde.

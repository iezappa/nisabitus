# Server block for nginxinc/nginx-unprivileged (replaces conf.d/default.conf).
#
# Notes on headers
# ----------------
# nginx drops ALL inherited add_header directives in a location that defines
# its own add_header. That is why the security/isolation headers are repeated
# in every location below.
#
# Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy:
#   Drift web docs: COOP "same-origin" + COEP "require-corp" (or
#   "credentialless") enable the fastest OPFS-based implementation
#   (synchronous file access via SharedArrayBuffer / Atomics.wait). Without
#   them Drift still works but falls back to IndexedDB-based storage.
#   https://drift.simonbinder.eu/platforms/web/
#   "require-corp" is used because Safari does not support "credentialless".
#   Consequence: every cross-origin resource must send CORP/CORS headers.
#   The Dockerfile builds with --no-web-resources-cdn so CanvasKit is served
#   from this origin. If the app loads other third-party resources (e.g.
#   fallback fonts from fonts.gstatic.com, images from other hosts), test them
#   in the browser console; remove COEP if something breaks and accept the
#   IndexedDB fallback.
#
#   The two video players are the exception, and they are not served by CORP:
#   a framed document has to send COEP itself, and YouTube sends it
#   report-only. They are embedded in a "credentialless" iframe instead (see
#   core/media/video_frame_web.dart), which is the exception written for this
#   and which keeps the isolation the database wants. Safari knows neither
#   form of credentialless, so there the frame stays blank and the viewer
#   falls back to the button that opens the link outside the app — which is
#   the same thing Android and the desktop builds do.
#
# Content-Security-Policy (documents only: the entry points and the SPA
# fallback; a header on a .js or .wasm response governs nothing):
#   default-src 'self'      everything comes from this origin. The app has no
#                           backend and loads no third-party resource: the
#                           Dockerfile builds with --no-web-resources-cdn, so
#                           CanvasKit is local, and the web update check reads
#                           update.json from this same origin.
#   script-src              'wasm-unsafe-eval' is required: CanvasKit, skwasm
#                           and sqlite3.wasm are WebAssembly, and without it
#                           the app does not start. It permits WebAssembly
#                           only; it does NOT re-enable eval() or
#                           new Function(), which 'unsafe-eval' would. blob:
#                           is required too — Flutter's loader starts its
#                           renderer workers from a blob URL. No
#                           'unsafe-inline': web/index.html has a single
#                           external <script> (flutter_bootstrap.js).
#   style-src 'unsafe-inline'  the Flutter engine injects its own <style>
#                           elements (glass pane layout, @font-face) into the
#                           document at runtime and there is no nonce to hand
#                           them. This cannot be tightened without patching
#                           the engine; the residual risk is CSS injection,
#                           not script execution.
#   img-src / font-src data:, blob:  icons and the canvas/image decoding
#                           Flutter does. The app bundles no custom font
#                           family (pubspec.yaml has no `fonts:` section) and
#                           shows no remote image, so neither needs a remote
#                           origin. fonts.gstatic.com is deliberately absent:
#                           CanvasKit's missing-glyph fallback to it is
#                           already blocked by COEP above, so listing it would
#                           only widen the policy without making it work.
#   connect-src 'self'      version.json, update.json, the service worker and
#                           the asset/wasm fetches. The web build checks for
#                           updates against its OWN origin
#                           (WebUpdateService); api.github.com is in the
#                           bundle only for the desktop/Android path
#                           (GitHubUpdateService) and is never called here, so
#                           it is not listed. Keeping this at 'self' is what
#                           stops a habit log, a journal entry or a medication
#                           record from being posted anywhere if a script is
#                           ever injected.
#   worker-src 'self' blob: drift_worker.js and sw.js are same-origin; the
#                           engine and the wasm toolchain create workers from
#                           blob URLs.
#   frame-src youtube-nocookie, player.vimeo  the only two things this app
#                           ever frames: the video saved on an exercise, and
#                           the sound played beside the focus timer. Both are
#                           links the user pasted themselves, and nothing is
#                           loaded from either host until they do. Without
#                           this the frames are refused by default-src and
#                           both features are a blank rectangle.
#   object-src 'none', base-uri 'self', form-action 'none', frame-ancestors
#                           'none'  nothing here embeds a plugin, rewrites its
#                           base href or submits a form, and the app must not
#                           be framed (clickjacking).
#   X-Frame-Options DENY    the same thing as frame-ancestors for browsers
#                           that predate CSP level 2. Redundant in anything
#                           current, cheap to keep.
#   Referrer-Policy no-referrer  the app makes no remote request of its own on
#                           the web, and the only outbound navigations are the
#                           links the user opens on purpose (donations,
#                           contact, exercise videos). A Referer would leak
#                           the route they were on and nothing needs one.
#
#   UNVERIFIED: this policy was read off what the release web build contains
#   (one external script, WebAssembly, blob workers, no third-party origin),
#   not observed in a browser. Neither nginx nor a Docker daemon is reachable
#   on the machine that wrote it, so the config was never loaded and the app
#   was never served under it. Before trusting it, serve the image, open the
#   site and watch the console for "Refused to ..." (TODO.md).
#
# Caching:
#   Flutter web does NOT content-hash its main files (main.dart.js,
#   flutter_bootstrap.js, canvaskit/*). Long immutable caching would pin users
#   to old code, so code files use "no-cache" (always revalidated via ETag,
#   a cheap 304 when unchanged). Only static assets get a medium cache.
#   Offline use is handled by web/sw.js: it precaches with cache: "reload", so
#   the stored responses keep these headers (COOP/COEP/CORP) when served offline.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json application/wasm
        image/svg+xml font/ttf font/otf;

    # Liveness endpoint for the Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never cache the entry points: they decide which version the user runs.
    # sw.js (own service worker) must always be revalidated, or users stay on an
    # old worker; its scope is "/" (same folder), so no Service-Worker-Allowed.
    # update.json is fetched network-only by the app and the worker.
    location ~ ^/(index\.html|sw\.js|flutter_service_worker\.js|flutter_bootstrap\.js|flutter\.js|manifest\.json|version\.json|update\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Documents only (see the CSP note at the top of this file).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # WebAssembly (sqlite3.wasm, CanvasKit, skwasm). Browsers require
    # application/wasm for streaming compilation.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # JavaScript modules (.mjs is not in nginx's default mime.types) and
    # regular JS (main.dart.js, drift_worker.js, canvaskit loaders).
    location ~* \.(mjs|js)$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static assets (images, fonts, icons). Not hashed either, so a moderate
    # cache instead of "immutable".
    location ~* ^/(assets|icons)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths (go_router path URLs) load index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Documents only (see the CSP note at the top of this file).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
